<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#667eea" stroke="#fff" stroke-width="4"/>
  
  <!-- Doctor icon -->
  <g transform="translate(100, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="25" fill="#fff"/>
    
    <!-- Body -->
    <path d="M -30 10 L -30 50 L 30 50 L 30 10 C 30 10 20 0 0 0 C -20 0 -30 10 -30 10" fill="#fff"/>
    
    <!-- Stethoscope -->
    <path d="M -15 -10 Q -15 -30 -5 -35 L 5 -35 Q 15 -30 15 -10" 
          fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-5" cy="-35" r="3" fill="#667eea"/>
    <circle cx="5" cy="-35" r="3" fill="#667eea"/>
    
    <!-- Medical cross -->
    <rect x="-5" y="15" width="10" height="25" fill="#ff6b6b" rx="2"/>
    <rect x="-12.5" y="22.5" width="25" height="10" fill="#ff6b6b" rx="2"/>
  </g>
</svg>
